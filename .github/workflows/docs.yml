name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install (with docs deps)
        run: uv sync --extra doc
      - name: Build Sphinx docs (warnings as errors)
        # Build only to verify it succeeds; ReadTheDocs hosts the published docs,
        # so we don't upload an artifact (that consumes Actions storage).
        run: uv run sphinx-build -W -b html doc doc/_build/html
