name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

jobs:
  # Run the full test suite before releasing.
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - name: Check distributions
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    # Trusted publishing to PyPI via OIDC (configure the publisher on PyPI and
    # create a `pypi` environment in the repo settings).
    environment:
      name: pypi
      url: https://pypi.org/p/moderndive
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
