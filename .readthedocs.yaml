# Read the Docs configuration. See:
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # The docs execute {python} cells with myst-nb and render plotly figures as
    # static PNGs via kaleido, which (>=1.0) needs a Chrome it doesn't bundle.
    post_install:
      - python -c "import kaleido; kaleido.get_chrome_sync()"

sphinx:
  configuration: doc/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - doc
